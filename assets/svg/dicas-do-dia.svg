<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 168" width="100%" height="168">
  <defs>
    <!-- Gradiente de Céu de Pôr do Sol (Sunset) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E"/>
      <stop offset="30%" stop-color="#4B1248"/>
      <stop offset="60%" stop-color="#B23A48"/>
      <stop offset="85%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7A072"/>
    </linearGradient>

    <!-- Gradiente do Sol Suave -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFB347" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#FF5E36" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5E36" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente dos Montes / Silhuetas -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#671F42" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2D0B2B" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20061E"/>
      <stop offset="100%" stop-color="#0E020D"/>
    </linearGradient>

    <!-- Efeito de vidro para a caixa de texto (mais translúcido) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140518" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#260A22" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Máscara com gradiente vertical reduzido (faixa de transição mais sutil e estreita) -->
    <linearGradient id="fadeMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="verticalFadeMask">
      <rect width="800" height="168" fill="url(#fadeMaskGrad)"/>
    </mask>

    <!-- Máscara com gradiente horizontal para desvanecer as laterais do card interior -->
    <linearGradient id="horizontalFadeMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="horizontalFadeMask">
      <rect width="800" height="168" fill="url(#horizontalFadeMaskGrad)"/>
    </mask>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');

      .card-title {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #FFD166;
      }

      .quote-text {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 19px;
        font-weight: 600;
        fill: #FFF5EE;
        text-anchor: middle;
      }

      .quote-icon {
        font-size: 20px;
      }

      /* Animação com 6 frases (ciclo total: 30s = 5s por frase)
         Cada frase tem 5s dentro de 30s (16.66% do ciclo total):
         0% -> 0.67s (2.2%): fade-in
         0.67s -> 4.33s (14.4%): exibição estável
         4.33s -> 4.90s (16.3%): fade-out
         16.66% -> 100%: invisível */
      @keyframes cycleQuotes {
        0% { opacity: 0; transform: translateY(6px); visibility: hidden; }
        0.5% { opacity: 0; transform: translateY(6px); visibility: visible; }
        2.2% { opacity: 1; transform: translateY(0); visibility: visible; }
        14.4% { opacity: 1; transform: translateY(0); visibility: visible; }
        16.3% { opacity: 0; transform: translateY(-6px); visibility: visible; }
        16.66% { opacity: 0; transform: translateY(-6px); visibility: hidden; }
        100% { opacity: 0; visibility: hidden; }
      }

      .phrase-1, .phrase-2, .phrase-3, .phrase-4, .phrase-5, .phrase-6 {
        opacity: 0;
      }

      .phrase-1 { animation: cycleQuotes 30s infinite 0s; }
      .phrase-2 { animation: cycleQuotes 30s infinite 5s; }
      .phrase-3 { animation: cycleQuotes 30s infinite 10s; }
      .phrase-4 { animation: cycleQuotes 30s infinite 15s; }
      .phrase-5 { animation: cycleQuotes 30s infinite 20s; }
      .phrase-6 { animation: cycleQuotes 30s infinite 25s; }

      .sun-pulse {
        animation: pulseSun 8s ease-in-out infinite alternate;
      }

      @keyframes pulseSun {
        0% { r: 90px; opacity: 0.85; }
        100% { r: 105px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Conteúdo Visual com Máscara de Desvanecimento Vertical (Topo e Base) -->
  <g mask="url(#verticalFadeMask)">
    <!-- Fundo Sunset -->
    <rect width="800" height="168" fill="url(#skyGrad)"/>

    <!-- Sol no Horizonte -->
    <circle cx="400" cy="126" r="70" fill="url(#sunGrad)" class="sun-pulse"/>

    <!-- Silhueta dos Montes de Fundo -->
    <path d="M 0 168 L 0 122 Q 160 94 320 112 Q 480 130 620 105 Q 720 88 800 115 L 800 168 Z" fill="url(#mountainBack)"/>

    <!-- Silhueta dos Montes de Frente -->
    <path d="M 0 168 L 0 133 Q 180 112 360 136 Q 540 161 700 126 Q 760 112 800 130 L 800 168 Z" fill="url(#mountainFront)"/>
  </g>

  <!-- Caixa de Vidro Fosco (Glassmorphism) com fade-out nas laterais (esquerda e direita) -->
  <rect x="0" y="42" width="800" height="84" fill="url(#glassGrad)" stroke="#FFA07A" stroke-opacity="0.18" stroke-width="1" mask="url(#horizontalFadeMask)"/>

  <!-- Cabeçalho do Card: Ícone e Título -->
  <g transform="translate(400, 68)">
    <!-- Ícone de Sol / Brilho -->
    <path d="M -125 -6 L -125 0 M -125 6 L -125 0 M -120 -4 L -125 0 M -130 4 L -125 0" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="0" text-anchor="middle" class="card-title">🌅 Para Melhorar seu Dia</text>
  </g>

  <!-- Linha Decorativa Alaranjada -->
  <line x1="280" y1="78" x2="520" y2="78" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Frases Rotativas Dinâmicas (Uma por vez com transição suave) -->
  <g id="quotes-container" transform="translate(400, 108)">

    <!-- Frase 1 -->
    <g class="phrase-1">
      <text y="0" class="quote-text">💧 Lembre-se de beber água e hidratar o corpo.</text>
    </g>

    <!-- Frase 2 -->
    <g class="phrase-2">
      <text y="0" class="quote-text">✨ Pense em algo bom que te faz feliz e grato hoje.</text>
    </g>

    <!-- Frase 3 -->
    <g class="phrase-3">
      <text y="0" class="quote-text">💌 Mande uma mensagem de carinho para quem você ama.</text>
    </g>

    <!-- Frase 4 -->
    <g class="phrase-4">
      <text y="0" class="quote-text">🪑 Ajuste sua postura, relaxe os ombros e respire fundo.</text>
    </g>

    <!-- Frase 5 -->
    <g class="phrase-5">
      <text y="0" class="quote-text">☕ Faça uma pausa de 5 minutos para descansar a vista.</text>
    </g>

    <!-- Frase 6 -->
    <g class="phrase-6">
      <text y="0" class="quote-text">🌱 Celebre as pequenas vitórias do seu progresso diário.</text>
    </g>

  </g>
</svg>
